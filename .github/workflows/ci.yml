
name: CodeVault CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Generate Test Keys
      run: |
        # Generate temporary keys for testing purposes
        openssl genrsa -out backend/private_key.pem 2048
        openssl rsa -in backend/private_key.pem -outform PEM -pubout -out backend/public_key.pem

    - name: Run Tests
      # PYTHONPATH needs to include the root for absolute imports (backend.x) to work
      env:
        ROOT_ENDPOINT: "/api/v1"
        DATABASE_URL: "postgresql://postgres:password@localhost/codevault" # Mocked in tests, but env required by db.py init
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest tests/test_auth.py
